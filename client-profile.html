<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniFlow � Client Profile</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .profile-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--blue-soft);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
    }

    .profile-meta {
      color: var(--ink-3);
      font-size: 13px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .detail-row {
      font-size: 13px;
      display: flex;
      gap: 8px;
    }

    .detail-label {
      width: 110px;
      color: var(--ink-3);
      font-weight: 600;
    }

    .pill-small {
      padding: 4px 8px;
      border-radius: 10px;
      background: var(--bg);
      font-weight: 700;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <polygon
            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
        </svg>
      </div>
      <span class="logo-text">Omni<span>Flow</span></span>
    </div>
    <nav>
      <div class="nav-label">Main</div>
      <a class="nav-item" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>Home</a>
      <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" />
          <rect x="14" y="3" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" />
          <rect x="3" y="14" width="7" height="7" />
        </svg>Dashboard</a>
      <div class="nav-divider"></div>
      <div class="nav-label">Operations</div>
      <a class="nav-item" href="orders.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>Order Management</a>
      <a class="nav-item active" href="clients.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
        </svg>Client List</a>
      <a class="nav-item" href="production.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>Production</a>
      <a class="nav-item" href="inventory.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
        </svg>Inventory</a>
      <div class="nav-divider"></div>
      <div class="nav-label">Insights</div>
      <a class="nav-item" href="reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />
        </svg>Reports</a>
      <div class="nav-divider"></div>
      <a class="nav-item" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14" />
        </svg>Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar" id="user-avatar"></div>
      <div>
        <div class="user-name" id="user-name">�</div>
        <div class="user-role" id="user-role">�</div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Client Profile</span>
    </header>

    <main class="content">
      <div class="page-header">
        <div class="page-title" id="client-name">Loading�</div>
        <div class="page-sub" id="client-sub">Client details and related orders</div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="profile-header">
            <div class="profile-avatar" id="client-avatar">--</div>
            <div>
              <div class="page-title" id="client-name-2">�</div>
              <div class="profile-meta" id="client-meta">�</div>
            </div>
          </div>
          <div class="profile-grid">
            <div class="detail-row">
              <div class="detail-label">Contact</div>
              <div id="client-contact">�</div>
            </div>
            <div class="detail-row">
              <div class="detail-label">Email</div>
              <div id="client-email">�</div>
            </div>
            <div class="detail-row">
              <div class="detail-label">Phone</div>
              <div id="client-phone">�</div>
            </div>
            <div class="detail-row">
              <div class="detail-label">Address</div>
              <div id="client-address">�</div>
            </div>
          </div>
          <div class="detail-row" style="margin-top:6px; gap:12px;">
            <span class="pill-small" id="client-orders">Orders: �</span>
            <span class="pill-small" id="client-active">Active: �</span>
            <span class="pill-small" id="client-since">Since: �</span>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <div class="card-header"><span class="card-title">Orders</span></div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>Qty</th>
              <th>Status</th>
              <th>Due</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr>
              <td colspan="5" class="empty">Loading�</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    let clientId = new URLSearchParams(window.location.search).get('id');
    if (!clientId) { window.location = 'clients.html'; }

    const pillClass = { 'done': 'pill-green', 'in-progress': 'pill-blue', 'pending': 'pill-amber', 'queued': 'pill-gray', 'cancelled': 'pill-gray' };
    const pillLabel = { 'done': 'Completed', 'in-progress': 'In Progress', 'pending': 'Pending', 'queued': 'Queued', 'cancelled': 'Cancelled' };

    function renderClient(c) {
      document.getElementById('client-name').textContent = c.name;
      document.getElementById('client-name-2').textContent = c.name;
      document.getElementById('client-avatar').textContent = (c.name || '--').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('client-meta').textContent = c.contact || c.email || c.phone || '�';
      document.getElementById('client-contact').textContent = c.contact || '�';
      document.getElementById('client-email').textContent = c.email || '�';
      document.getElementById('client-phone').textContent = c.phone || '�';
      document.getElementById('client-address').textContent = c.address || '�';
      document.getElementById('client-orders').textContent = `Orders: ${c.total_orders ?? '�'}`;
      document.getElementById('client-active').textContent = `Active: ${c.active_orders ?? '�'}`;
      document.getElementById('client-since').textContent = `Since: ${c.since ?? '�'}`;
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('orders-tbody');
      if (!orders.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty">No orders yet.</td></tr>'; return; }
      tbody.innerHTML = orders.map(o => `
      <tr>
        <td class="mono">${o.id}</td>
        <td>${o.product}</td>
        <td>${o.qty}</td>
        <td><span class="pill ${pillClass[o.status] || 'pill-gray'}">${pillLabel[o.status] || o.status}</span></td>
        <td>${o.due_date}</td>
      </tr>`).join('');
    }

    fetch('/api/clients/' + clientId)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(renderClient)
      .catch(() => window.location = 'clients.html');

    fetch('/api/orders?client_id=' + clientId)
      .then(r => r.json())
      .then(renderOrders);

    // Set sidebar user
    (function loadUser() {
      fetch('/api/me').then(r => r.json()).then(me => {
        const n = document.getElementById('user-name');
        const ro = document.getElementById('user-role');
        const av = document.getElementById('user-avatar');
        if (n) n.textContent = me.name || '—';
        if (ro) ro.textContent = me.role || '—';
        if (av) av.textContent = (me.name || '—').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      });
    })();

    function logout() {
      fetch('/api/logout', { method: 'POST' }).then(() => window.location = '/login');
    }
  </script>
</body>

</html>
